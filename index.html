<title>Digit Muncher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#333d72;
    --panel:#414c8c;
    --panel-edge:#5c68b0;
    --tile:#4b56a0;
    --tile-edge:#707bd4;
    --ink:#ffffff;
    --muted:#c3c9ee;
    --lime:#b7f03e;
    --coral:#ff5d5d;
    --gold:#ffc94a;
    --font-display: 'Press Start 2P', 'Courier New', monospace;
    --font-body: 'Baloo 2', 'Comic Sans MS', system-ui, sans-serif;
    --font-mono: 'Space Mono', 'Courier New', monospace;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 50% 0%, #3c478a 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
    padding:20px 16px 32px;
  }

  .cabinet{
    width:100%;
    max-width:520px;
    background:linear-gradient(180deg,#454f92,#363f78);
    border:3px solid var(--panel-edge);
    border-radius:22px;
    padding:16px;
    box-shadow:
      0 0 0 1px rgba(183,240,62,0.08),
      0 30px 60px -20px rgba(0,0,0,0.65),
      inset 0 0 40px rgba(0,0,0,0.35);
  }

  .marquee{
    text-align:center;
    padding:10px 8px 14px;
  }
  .marquee h1{
    margin:0;
    font-family:var(--font-display);
    font-size:clamp(16px, 5vw, 26px);
    line-height:1.4;
    letter-spacing:1px;
    color:var(--lime);
    text-shadow:0 0 14px rgba(183,240,62,0.55), 0 0 2px rgba(183,240,62,0.8);
    text-wrap:balance;
  }
  .marquee p{
    margin:6px 0 0;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:2px;
    color:var(--muted);
  }

  .screen{
    background:var(--panel);
    border:2px solid var(--panel-edge);
    border-radius:14px;
    padding:14px;
    position:relative;
    overflow:hidden;
  }
  .screen::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
  }

  .hud{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-family:var(--font-display);
    font-size:10px;
    letter-spacing:1px;
    margin-bottom:10px;
    position:relative;
    z-index:1;
  }
  .hud-item{color:var(--muted); display:flex; flex-direction:column; gap:5px; align-items:center;}
  .hud-item span{color:var(--gold); font-size:13px;}
  .hud-item.lives span{color:var(--coral); font-size:12px; letter-spacing:0;}
  .life-row{display:flex; gap:4px;}
  .life-dot{width:9px; height:9px; border-radius:2px; background:var(--coral); box-shadow:0 0 6px rgba(255,93,93,0.7);}
  .life-dot.spent{background:transparent; border:1px solid #7d86c4; box-shadow:none;}

  .rule-banner{
    text-align:center;
    font-family:var(--font-body);
    font-weight:600;
    font-size:clamp(12.5px, 3.6vw, 15px);
    color:var(--ink);
    background:rgba(255,201,74,0.08);
    border:1px solid rgba(255,201,74,0.35);
    border-radius:10px;
    padding:8px 10px;
    margin-bottom:12px;
    position:relative;
    z-index:1;
  }
  .rule-banner strong{color:var(--gold); letter-spacing:0.5px;}

  .grid{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    grid-template-rows:repeat(5, 1fr);
    gap:clamp(4px, 1.4vw, 7px);
    aspect-ratio:1/1;
  }

  .tile{
    background:var(--tile);
    border:1px solid var(--tile-edge);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-mono);
    font-weight:700;
    font-variant-numeric:tabular-nums;
    font-size:clamp(13px, 4.2vw, 19px);
    color:var(--ink);
    transition:background 0.15s, border-color 0.15s, opacity 0.2s;
  }
  .tile.eaten{
    background:transparent;
    border-color:rgba(255,255,255,0.18);
    opacity:0.45;
  }
  .tile.flash-good{background:rgba(183,240,62,0.35); border-color:var(--lime);}
  .tile.flash-bad{background:rgba(255,93,93,0.35); border-color:var(--coral);}

  .sprite{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transition:grid-row 0.12s ease, grid-column 0.12s ease;
  }
  .muncher-body{
    width:78%;
    height:78%;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d4ff8a, var(--lime));
    box-shadow:0 0 12px rgba(183,240,62,0.75);
    position:relative;
  }
  .muncher-body::before, .muncher-body::after{
    content:"";
    position:absolute;
    width:12%;
    height:12%;
    border-radius:50%;
    background:#1a1f14;
    top:26%;
  }
  .muncher-body::before{left:26%;}
  .muncher-body::after{left:54%;}
  .muncher-body .mouth{
    position:absolute;
    left:14%;
    right:14%;
    bottom:10%;
    height:40%;
    background:#171a2a;
    border-radius:0 0 40% 40%;
    clip-path:polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
  }
  .muncher.chomp .muncher-body .mouth{animation:chompMouth 0.18s steps(2);}

  .troggle-body{
    width:72%;
    height:72%;
    background:linear-gradient(160deg,#ff8f7f,var(--coral));
    border-radius:22%;
    transform:rotate(45deg);
    box-shadow:0 0 10px rgba(255,93,93,0.7);
    position:relative;
  }
  .troggle-body::before, .troggle-body::after{
    content:"";
    position:absolute;
    width:14%;
    height:14%;
    background:#1a1220;
    border-radius:50%;
    top:32%;
    transform:rotate(-45deg);
  }
  .troggle-body::before{left:22%;}
  .troggle-body::after{left:56%;}

  @keyframes chompMouth{
    0%{height:40%;}
    50%{height:12%;}
    100%{height:40%;}
  }
  @media (prefers-reduced-motion: reduce){
    .muncher.chomp .muncher-body .mouth{animation:none;}
    .sprite{transition:none;}
  }

  .message[hidden]{display:none;}
  .message{
    position:absolute;
    inset:0;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    background:rgba(15,17,32,0.88);
    font-family:var(--font-display);
    font-size:clamp(13px, 4vw, 17px);
    color:var(--gold);
    line-height:1.8;
    text-shadow:0 0 10px rgba(255,201,74,0.5);
  }
  .message .sub{
    display:block;
    font-family:var(--font-body);
    font-size:14px;
    color:var(--ink);
    margin-top:8px;
    font-weight:600;
  }

  .controls{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .hint{
    margin:0;
    font-size:13px;
    color:var(--muted);
    text-align:center;
  }
  .dpad{
    display:grid;
    grid-template-columns:44px 44px 44px;
    grid-template-rows:40px 40px;
    grid-template-areas:
      ".    up   ."
      "left down right";
    gap:6px;
  }
  .dpad button{
    font-family:var(--font-display);
    font-size:14px;
    color:var(--ink);
    background:var(--tile);
    border:1px solid var(--tile-edge);
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .dpad button:active{background:var(--panel-edge);}
  .dpad button:focus-visible, .restart:focus-visible{
    outline:2px solid var(--lime);
    outline-offset:2px;
  }
  .dpad .up{grid-area:up;}
  .dpad .left{grid-area:left;}
  .dpad .down{grid-area:down;}
  .dpad .right{grid-area:right;}

  .restart{
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    color:#14172a;
    background:var(--lime);
    border:none;
    border-radius:9px;
    padding:9px 18px;
    cursor:pointer;
  }
  .restart:active{transform:translateY(1px);}

  .best{
    text-align:center;
    margin:12px 0 0;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--muted);
  }
</style>

<div class="cabinet">
  <div class="marquee">
    <h1>DIGIT MUNCHER</h1>
    <p>EAT THE RIGHT NUMBERS. DODGE THE TROGGLES.</p>
  </div>

  <div class="screen">
    <div class="hud">
      <div class="hud-item">SCORE<span id="scoreVal">0</span></div>
      <div class="hud-item">LEVEL<span id="levelVal">1</span></div>
      <div class="hud-item lives">LIVES<span class="life-row" id="livesRow"></span></div>
    </div>
    <div class="rule-banner">MUNCH THE <strong id="ruleLabel">MULTIPLES OF 3</strong></div>
    <div class="grid" id="grid"></div>
    <div class="message" id="message" hidden></div>
  </div>

  <div class="controls">
    <p class="hint">Arrow keys or WASD move the muncher — it eats whatever tile it steps on.</p>
    <div class="dpad">
      <button class="up" id="btnUp" aria-label="Move up">▲</button>
      <button class="left" id="btnLeft" aria-label="Move left">◀</button>
      <button class="down" id="btnDown" aria-label="Move down">▼</button>
      <button class="right" id="btnRight" aria-label="Move right">▶</button>
    </div>
    <button class="restart" id="restartBtn">Restart Game</button>
  </div>

  <p class="best">BEST SCORE: <span id="bestVal">0</span></p>
</div>

<script>
(function(){
  var GRID_SIZE = 5;
  var CELL_COUNT = GRID_SIZE * GRID_SIZE;
  var CENTER = { row: 2, col: 2 };

  function isPrime(n){
    if (n < 2) return false;
    for (var i = 2; i * i <= n; i++){ if (n % i === 0) return false; }
    return true;
  }

  var LEVELS = [
    { label: 'MULTIPLES OF 3', range: 30, test: function(n){ return n % 3 === 0; } },
    { label: 'EVEN NUMBERS',   range: 40, test: function(n){ return n % 2 === 0; } },
    { label: 'FACTORS OF 24',  range: 24, test: function(n){ return 24 % n === 0; } },
    { label: 'MULTIPLES OF 4', range: 48, test: function(n){ return n % 4 === 0; } },
    { label: 'PRIME NUMBERS',  range: 50, test: function(n){ return isPrime(n); } },
    { label: 'MULTIPLES OF 5', range: 60, test: function(n){ return n % 5 === 0; } },
    { label: 'FACTORS OF 36',  range: 36, test: function(n){ return 36 % n === 0; } },
    { label: 'ODD NUMBERS',    range: 40, test: function(n){ return n % 2 === 1; } }
  ];

  var els = {
    grid: document.getElementById('grid'),
    score: document.getElementById('scoreVal'),
    level: document.getElementById('levelVal'),
    livesRow: document.getElementById('livesRow'),
    ruleLabel: document.getElementById('ruleLabel'),
    message: document.getElementById('message'),
    best: document.getElementById('bestVal'),
    restartBtn: document.getElementById('restartBtn'),
    btnUp: document.getElementById('btnUp'),
    btnDown: document.getElementById('btnDown'),
    btnLeft: document.getElementById('btnLeft'),
    btnRight: document.getElementById('btnRight')
  };

  var state = null;
  var troggleTimer = null;

  function getBest(){
    try { return parseInt(localStorage.getItem('digit-muncher-best') || '0', 10) || 0; }
    catch(e){ return 0; }
  }
  function setBest(v){
    try { localStorage.setItem('digit-muncher-best', String(v)); } catch(e){}
  }

  function troggleCountForLevel(level){
    if (level <= 1) return 0;
    if (level <= 3) return 1;
    if (level <= 5) return 2;
    if (level <= 7) return 3;
    return 4;
  }
  function troggleSpeedForLevel(level){
    return Math.max(420, 900 - (level - 1) * 55);
  }

  var CORNERS = [ {row:0,col:0}, {row:0,col:GRID_SIZE-1}, {row:GRID_SIZE-1,col:0}, {row:GRID_SIZE-1,col:GRID_SIZE-1} ];

  function buildGrid(levelConfig){
    var correct = [], incorrect = [];
    for (var n = 1; n <= levelConfig.range; n++){
      (levelConfig.test(n) ? correct : incorrect).push(n);
    }
    if (correct.length === 0) correct.push(levelConfig.range);
    if (incorrect.length === 0) incorrect.push(1);

    var cells = [];
    for (var i = 0; i < CELL_COUNT; i++){
      var useCorrect = Math.random() < 0.42;
      var pool = useCorrect ? correct : incorrect;
      var value = pool[Math.floor(Math.random() * pool.length)];
      cells.push({ value: value, correct: levelConfig.test(value), alive: true, flash: null });
    }
    var hasCorrect = cells.some(function(c){ return c.correct; });
    if (!hasCorrect){
      var idx = Math.floor(Math.random() * CELL_COUNT);
      var v = correct[Math.floor(Math.random() * correct.length)];
      cells[idx] = { value: v, correct: true, alive: true, flash: null };
    }
    return cells;
  }

  function countRemaining(cells){
    var n = 0;
    for (var i = 0; i < cells.length; i++){ if (cells[i].alive && cells[i].correct) n++; }
    return n;
  }

  function createLevelState(level, score, lives){
    var levelConfig = LEVELS[(level - 1) % LEVELS.length];
    var cells = buildGrid(levelConfig);
    return {
      level: level,
      score: score,
      lives: lives,
      levelConfig: levelConfig,
      cells: cells,
      remaining: countRemaining(cells),
      muncher: { row: CENTER.row, col: CENTER.col },
      troggles: spawnTroggles(troggleCountForLevel(level)),
      transitioning: false,
      gameOver: false,
      chompTick: 0
    };
  }

  function spawnTroggles(count){
    var t = [];
    for (var i = 0; i < count; i++){
      t.push({ row: CORNERS[i].row, col: CORNERS[i].col });
    }
    return t;
  }

  function createInitialState(){
    return createLevelState(1, 0, 3);
  }

  function idxOf(row, col){ return row * GRID_SIZE + col; }

  function render(){
    els.score.textContent = state.score;
    els.level.textContent = state.level;
    els.ruleLabel.textContent = state.levelConfig.label;

    els.livesRow.innerHTML = '';
    for (var i = 0; i < 3; i++){
      var dot = document.createElement('span');
      dot.className = 'life-dot' + (i < state.lives ? '' : ' spent');
      els.livesRow.appendChild(dot);
    }

    var best = Math.max(getBest(), state.score);
    els.best.textContent = best;

    els.grid.innerHTML = '';
    for (var r = 0; r < GRID_SIZE; r++){
      for (var c = 0; c < GRID_SIZE; c++){
        var cell = state.cells[idxOf(r, c)];
        var tile = document.createElement('div');
        tile.className = 'tile' + (cell.alive ? '' : ' eaten') + (cell.flash ? ' flash-' + cell.flash : '');
        tile.style.gridRow = (r + 1) + ' / span 1';
        tile.style.gridColumn = (c + 1) + ' / span 1';
        tile.textContent = cell.alive ? cell.value : '';
        els.grid.appendChild(tile);
      }
    }

    var muncherEl = document.createElement('div');
    muncherEl.className = 'sprite muncher' + (state.chompTick % 2 === 1 ? ' chomp' : '');
    muncherEl.style.gridRow = (state.muncher.row + 1) + ' / span 1';
    muncherEl.style.gridColumn = (state.muncher.col + 1) + ' / span 1';
    muncherEl.innerHTML = '<div class="muncher-body"><div class="mouth"></div></div>';
    els.grid.appendChild(muncherEl);

    state.troggles.forEach(function(t){
      var tEl = document.createElement('div');
      tEl.className = 'sprite troggle';
      tEl.style.gridRow = (t.row + 1) + ' / span 1';
      tEl.style.gridColumn = (t.col + 1) + ' / span 1';
      tEl.innerHTML = '<div class="troggle-body"></div>';
      els.grid.appendChild(tEl);
    });

    if (state.messageText){
      els.message.hidden = false;
      els.message.innerHTML = state.messageText;
    } else {
      els.message.hidden = true;
    }
  }

  function clearFlashesSoon(){
    setTimeout(function(){
      state.cells.forEach(function(c){ c.flash = null; });
      render();
    }, 220);
  }

  function move(dRow, dCol){
    if (!state || state.transitioning || state.gameOver) return;
    var m = state.muncher;
    var newRow = Math.max(0, Math.min(GRID_SIZE - 1, m.row + dRow));
    var newCol = Math.max(0, Math.min(GRID_SIZE - 1, m.col + dCol));
    if (newRow === m.row && newCol === m.col) return;
    m.row = newRow;
    m.col = newCol;
    state.chompTick++;

    var caughtByTroggle = state.troggles.some(function(t){ return t.row === newRow && t.col === newCol; });
    if (caughtByTroggle){
      handleCatch();
      return;
    }

    var cell = state.cells[idxOf(newRow, newCol)];
    if (cell.alive){
      if (cell.correct){
        state.score += 10;
        cell.alive = false;
        cell.flash = 'good';
        state.remaining--;
      } else {
        state.lives--;
        cell.alive = false;
        cell.flash = 'bad';
      }
      clearFlashesSoon();
    }

    render();

    if (state.lives <= 0){
      triggerGameOver();
      return;
    }
    if (state.remaining <= 0){
      triggerLevelClear();
      return;
    }
  }

  function handleCatch(){
    state.lives--;
    state.messageText = 'OUCH!<span class="sub">A troggle got you</span>';
    state.transitioning = true;
    stopTroggleTimer();
    render();
    setTimeout(function(){
      if (state.lives <= 0){
        triggerGameOver();
        return;
      }
      state.muncher = { row: CENTER.row, col: CENTER.col };
      state.troggles = spawnTroggles(troggleCountForLevel(state.level));
      state.messageText = null;
      state.transitioning = false;
      render();
      startTroggleTimer();
    }, 900);
  }

  function triggerLevelClear(){
    state.transitioning = true;
    state.messageText = 'LEVEL CLEAR!<span class="sub">Score: ' + state.score + '</span>';
    stopTroggleTimer();
    render();
    setTimeout(function(){
      var next = createLevelState(state.level + 1, state.score, state.lives);
      state = next;
      render();
      startTroggleTimer();
    }, 1000);
  }

  function triggerGameOver(){
    state.gameOver = true;
    state.transitioning = true;
    stopTroggleTimer();
    var best = Math.max(getBest(), state.score);
    setBest(best);
    state.messageText = 'GAME OVER<span class="sub">Final score: ' + state.score + ' — press Restart</span>';
    render();
  }

  function moveTroggles(){
    if (!state || state.transitioning || state.gameOver) return;
    var directions = [ {r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1} ];
    state.troggles.forEach(function(t){
      var valid = directions
        .map(function(d){ return { row: t.row + d.r, col: t.col + d.c }; })
        .filter(function(p){ return p.row >= 0 && p.row < GRID_SIZE && p.col >= 0 && p.col < GRID_SIZE; });
      if (valid.length){
        var pick = valid[Math.floor(Math.random() * valid.length)];
        t.row = pick.row;
        t.col = pick.col;
      }
    });
    var caught = state.troggles.some(function(t){ return t.row === state.muncher.row && t.col === state.muncher.col; });
    if (caught){
      handleCatch();
    } else {
      render();
    }
  }

  function startTroggleTimer(){
    stopTroggleTimer();
    var count = troggleCountForLevel(state.level);
    if (count > 0){
      troggleTimer = setInterval(moveTroggles, troggleSpeedForLevel(state.level));
    }
  }
  function stopTroggleTimer(){
    if (troggleTimer){ clearInterval(troggleTimer); troggleTimer = null; }
  }

  function restart(){
    stopTroggleTimer();
    state = createInitialState();
    state.messageText = null;
    render();
    startTroggleTimer();
  }

  document.addEventListener('keydown', function(e){
    var key = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].indexOf(key) !== -1){
      e.preventDefault();
    }
    if (key === 'ArrowUp' || key === 'w' || key === 'W') move(-1, 0);
    else if (key === 'ArrowDown' || key === 's' || key === 'S') move(1, 0);
    else if (key === 'ArrowLeft' || key === 'a' || key === 'A') move(0, -1);
    else if (key === 'ArrowRight' || key === 'd' || key === 'D') move(0, 1);
  });

  els.btnUp.addEventListener('click', function(){ move(-1, 0); });
  els.btnDown.addEventListener('click', function(){ move(1, 0); });
  els.btnLeft.addEventListener('click', function(){ move(0, -1); });
  els.btnRight.addEventListener('click', function(){ move(0, 1); });
  els.restartBtn.addEventListener('click', restart);

  function start(saved){
    state = (saved && saved.cells) ? saved : createInitialState();
    if (state.messageText === undefined) state.messageText = null;
    render();
    if (!state.gameOver) startTroggleTimer();
    if (window.claude && window.claude.hot && window.claude.hot.snapshot){
      window.claude.hot.snapshot(function(){ return state; });
    }
  }

  if (window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start(window.claude && window.claude.hot ? window.claude.hot.data : null);
  }
})();
</script>
